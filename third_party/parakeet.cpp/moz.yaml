schema: 1

bugzilla:
  product: Core
  component: "Machine Learning"

origin:
  name: parakeet.cpp
  description: Parakeet (FastConformer) speech recognition in C++ with ggml, incl. cache-aware streaming

  url: https://github.com/mudler/parakeet.cpp

  release: f469a57270a1cc4554acb15febf60e56619673b9
  revision: f469a57270a1cc4554acb15febf60e56619673b9

  license: MIT

vendoring:
  url: https://github.com/mudler/parakeet.cpp
  source-hosting: github
  tracking: commit

  skip-vendoring-steps:
    - update-moz-build

  exclude:
    - "**"

  include:
    - LICENSE
    - src
    - include/parakeet.h
    - include/parakeet_capi.h
    - third_party/dr_wav.h

  patches:
    - parakeet-fd-loading.patch # load a model from an fd (sandboxed process)
    - parakeet-stream-words.patch # typed per-word drain (timing + confidence)
