[package]
name = "webnn_engine"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
mozbuild = "0.1"
mozilla-central-workspace-hack = { version = "0.1", features = ["webnn_engine"], optional = true }
rustnn = { git = "https://github.com/padenot/rustnn", rev = "07119a32083b2bb3df70b964962e9a4c6e82a24a", default-features = false, features = ["coreml-runtime"] }
serde_json = "1"

[lib]
path = "lib.rs"
crate-type = ["staticlib"]
