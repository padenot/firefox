[DEFAULT]
tags = "mtg"
subsuite = "media"
support-files = [
  "head.js",
  "hello.ogg",
  "hello.ogg^headers^",
  "kennedy-appolo.opus",
  "sinoid+hello.ogg",
  "sinoid+hello.ogg^headers^",
  "silence.ogg",
  "silence.ogg^headers^",
]

["test_preference_enable.html"]

# The parakeet tests run in their own subsuite (mochitest-speech-recognition) so
# the large model artifacts are fetched only for this task. The parakeet-asr tag
# makes runtests.py start the local model hub (serve_model.py) for them.
["test_concurrent_session.html"]
subsuite = "speech-recognition"
tags = "mtg parakeet-asr"

["test_parakeet_e2e.html"]
subsuite = "speech-recognition"
tags = "mtg parakeet-asr"

["test_parakeet_multilingual.html"]
subsuite = "speech-recognition"
tags = "mtg parakeet-asr"

# Fuzz-style stress tests that interleave Web Speech API calls in randomized
# order, using the in-process mock backend (no real model hub/microphone
# needed). These are nets for concurrency bugs in the IPC/session lifecycle
# (see bug 1940906), not targeted regression tests for a single bug.
["test_fuzz_availability_install.html"]

["test_fuzz_session_lifecycle.html"]

["test_fuzz_iframe_teardown.html"]
