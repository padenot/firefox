<!DOCTYPE HTML>
<html>
<head>
  <meta charset="utf-8">
  <title>SpeechRecognition: parakeet end-to-end</title>
  <script src="/tests/SimpleTest/SimpleTest.js"></script>
  <script src="head.js"></script>
  <link rel="stylesheet" type="text/css" href="/tests/SimpleTest/test.css"/>
  <style>
    #results { font-family: monospace; font-size: 11px; margin-top: 10px; }
    .reference { color: #006; background: #eef; padding: 8px; white-space: pre-wrap; }
    .recognized { color: #060; background: #efe; padding: 8px; white-space: pre-wrap; }
    label { font-weight: bold; display: block; margin-top: 8px; }
  </style>
</head>
<body>
<div id="content"></div>
<div id="results">
  <label>Reference (first 60s of speech):</label>
  <div class="reference" id="ref-text">loading...</div>
  <label>Recognized:</label>
  <div class="recognized" id="rec-text">waiting...</div>
</div>
<pre id="test">
<script>
"use strict";

// End-to-end quality test for local speech recognition via parakeet.
//
// This test is heavily instrumented: when it fails (especially on a new
// platform) the log alone should tell you WHY. It checks, in order, that:
//   - the on-device model is reachable (SpeechRecognition.available),
//   - the AudioContext actually reaches "running" (not just created),
//   - real audio is flowing into the captured MediaStreamTrack (FFT levels,
//     not merely that a track object exists),
//   - every recognition lifecycle event fires, with timestamps,
// and prints a periodic status line plus a final summary.
//
// Requires (headless): XDG_RUNTIME_DIR + pipewire/pipewire-pulse/wireplumber
// for audio, and python3 testing/tools/serve_model.py for the model hub.
//
// Run:
//   XDG_RUNTIME_DIR=/run/user/$(id -u) ./mach mochitest --headless \
//       dom/media/webspeech/recognition/test/test_parakeet_e2e.html

const SERVER_PORT = 8766;
const LANG = "en-US";
// How long to listen in milliseconds — longer = better quality assessment.
const LISTEN_DURATION_MS = 60000;

SimpleTest.waitForExplicitFinish();
SimpleTest.requestCompleteLog();
SimpleTest.requestLongerTimeout(600);
SimpleTest.requestFlakyTimeout("waiting for parakeet inference to complete");

const T0 = performance.now();
const ms = () => "+" + Math.round(performance.now() - T0) + "ms";
function diag(msg) { info("[diag " + ms() + "] " + msg); }

// Inline AudioStreamAnalyser from dom/media/webrtc/tests/mochitests/head.js
function AudioStreamAnalyser(ac, stream) {
  this.audioContext = ac;
  this.analyser = this.audioContext.createAnalyser();
  this.analyser.smoothingTimeConstant = 0.2;
  this.analyser.fftSize = 1024;
  this.sourceNodes = [];
  this.connectTrack = t => {
    let source = this.audioContext.createMediaStreamSource(new MediaStream([t]));
    this.sourceNodes.push(source);
    source.connect(this.analyser);
  };
  stream.getAudioTracks().forEach(t => this.connectTrack(t));
  this.data = new Uint8Array(this.analyser.frequencyBinCount);
}
AudioStreamAnalyser.prototype.getByteFrequencyData = function() {
  this.analyser.getByteFrequencyData(this.data);
  return this.data;
};
// Peak and mean FFT magnitude over the current frame: the cheap way to tell
// "is there actually sound on this track" from "the track merely exists".
AudioStreamAnalyser.prototype.levels = function() {
  const d = this.getByteFrequencyData();
  let max = 0, sum = 0;
  for (let i = 0; i < d.length; i++) { sum += d[i]; if (d[i] > max) max = d[i]; }
  return { max, avg: +(sum / d.length).toFixed(1) };
};
AudioStreamAnalyser.prototype.disconnect = function() {
  this.sourceNodes.forEach(n => n.disconnect());
};
SpecialPowers.pushPrefEnv({
  set: [
    ["media.webspeech.recognition.enable", true],
    ["browser.ml.modelHubRootUrl", `http://localhost:${SERVER_PORT}/`],
    ["media.webspeech.recognition.audio_length_ms", 5000],
    ["media.webspeech.recognition.interval_ms", 1000],
    ["media.webspeech.recognition.num_threads", 4],
    ...SPEECH_TEST_AUTOPLAY_PREFS,
    ["media.webspeech.recognition.model-download.prompt.testing", true],
    ["media.navigator.permission.disabled", true],
  ],
}, async () => {
  let statusTimer = null;
  try {
    // Fetch reference transcript.
    const refResp = await fetch(`http://localhost:${SERVER_PORT}/transcript.txt`);
    const refText = refResp.ok ? await refResp.text() : "(reference unavailable)";
    document.getElementById("ref-text").textContent = refText.slice(0, 800) + "...";
    diag("reference transcript fetched (ok=" + refResp.ok + ")");

    // 1. Model reachability. If this is not "available"/"downloadable" the model
    //    hub is not serving the pack and start() will fail with `network`.
    const availability =
      await SpeechRecognition.available({ langs: [LANG], processLocally: true });
    diag(`model availability (${LANG}, on-device): ${availability}`);

    // Install the model through the proper permission flow (auto-approved via
    // the testing pref). install() requires transient user activation, so
    // synthesize a user gesture first.
    if (availability !== "available") {
      diag("installing model...");
      SpecialPowers.wrap(document).notifyUserGestureActivation();
      const installed = await SpeechRecognition.install({ langs: [LANG], processLocally: true });
      diag(`install() => ${installed}`);
      ok(installed, "Model installed successfully");
      if (!installed) {
        ok(false, "install() returned false; cannot proceed");
        SimpleTest.finish();
        return;
      }
    } else {
      diag("model already available, skipping install()");
    }

    // 2. AudioContext must actually run. Created suspended; resume explicitly.
    const ctx = await createResumedAudioContext();
    diag(`AudioContext after resume(): state=${ctx.state} baseLatency=${ctx.baseLatency}`);

    // Kick the context with a silent looping source.
    const kickBuf = ctx.createBuffer(1, 2048, ctx.sampleRate);
    const kick = ctx.createBufferSource();
    kick.buffer = kickBuf;
    kick.loop = true;
    kick.connect(ctx.destination);
    kick.start(0);

    const audio = document.createElement("audio");
    audio.id = "audioElement";
    audio.controls = true;
    // Same-origin support file (served by the mochitest server); only the model
    // comes from the local model hub (serve_model.py) via modelHubRootUrl.
    audio.src = "kennedy-appolo.opus";
    document.getElementById("content").appendChild(audio);

    const src = ctx.createMediaElementSource(audio);
    const dst = ctx.createMediaStreamDestination();
    src.connect(dst);
    src.connect(ctx.destination);

    await new Promise((resolve, reject) => {
      audio.addEventListener("canplaythrough", resolve, { once: true });
      audio.addEventListener("error", () => reject(new Error("Audio load failed")), { once: true });
      audio.load();
    });
    diag(`audio loaded: readyState=${audio.readyState} duration=${audio.duration.toFixed(2)}s ` +
         `muted=${audio.muted} volume=${audio.volume} error=${audio.error ? audio.error.code : "none"}`);

    const track = dst.stream.getAudioTracks()[0];
    ok(track, "Got audio track");
    diag(`track: id=${track.id} readyState=${track.readyState} enabled=${track.enabled} muted=${track.muted}`);
    try { diag("track settings: " + JSON.stringify(track.getSettings())); } catch (e) { diag("track.getSettings(): " + e); }

    // Start playback from the beginning of speech.
    audio.currentTime = 0;
    await audio.play().then(() => diag("audio.play() resolved"),
                            e => diag("audio.play() rejected: " + e));

    // 3. Verify real audio is flowing into the captured track (the wayland/
    //    headless failure mode is a silent track despite ctx="running").
    //    Fails fast instead of hanging on the recognition events below.
    const maxLevel = await waitForAudioFlowing(ctx, dst.stream);
    diag(`audio is flowing into the track (peak FFT level ${maxLevel})`);
    ok(true, "audio is flowing into the track");

    // Kept alive for the periodic heartbeat below.
    const analyser = new AudioStreamAnalyser(ctx, dst.stream);

    const sr = new SpeechRecognition();
    sr.continuous = true;
    sr.lang = LANG;

    // 4. Log every lifecycle event with a timestamp.
    let audiostartFired = false, soundstartFired = false, speechstartFired = false;
    sr.onaudiostart = () => { audiostartFired = true; diag("event: audiostart"); };
    sr.onsoundstart = () => { soundstartFired = true; diag("event: soundstart"); };
    sr.onspeechstart = () => { speechstartFired = true; diag("event: speechstart"); };
    sr.onspeechend = () => diag("event: speechend");
    sr.onsoundend = () => diag("event: soundend");
    sr.onaudioend = () => diag("event: audioend");
    sr.onnomatch = () => diag("event: nomatch");

    let finalCount = 0, interimCount = 0;
    const transcript = await new Promise((resolve, reject) => {
      let text = "";
      sr.onresult = e => {
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) {
            finalCount++;
            const sentence = e.results[i][0].transcript;
            text += " " + sentence;
            diag(`final result #${finalCount}: "${sentence}" (conf=${e.results[i][0].confidence})`);
          } else {
            interimCount++;
          }
        }
        document.getElementById("rec-text").textContent = text.trim();
      };
      sr.onerror = e => {
        diag(`event: ERROR error="${e.error}" message="${e.message}"`);
        reject(new Error(e.error));
      };
      sr.onstart = () => diag("event: start");
      sr.onend = () => { diag("event: end"); resolve(text.trim()); };

      diag("calling sr.start(track)");
      sr.start(track);
      diag(`listening for ${LISTEN_DURATION_MS / 1000}s...`);

      // Periodic heartbeat so a stall is obvious in the log.
      statusTimer = setInterval(() => {
        const lvl = analyser.levels();
        diag(`status: ctx=${ctx.state} curTime=${audio.currentTime.toFixed(1)} ` +
             `level(max=${lvl.max}) finals=${finalCount} interims=${interimCount}`);
      }, 5000);

      setTimeout(() => { diag("stopping recognition"); sr.stop(); }, LISTEN_DURATION_MS);
    });

    clearInterval(statusTimer);
    analyser.disconnect();
    audio.pause();
    await ctx.close();

    diag("=== SUMMARY ===");
    diag(`model availability: ${availability}`);
    diag(`peak audio level seen: ${maxLevel} (0 == silent track)`);
    diag(`events: audiostart=${audiostartFired} soundstart=${soundstartFired} speechstart=${speechstartFired}`);
    diag(`results: ${finalCount} final, ${interimCount} interim`);
    diag(`transcript (${transcript.length} chars): ${transcript}`);
    diag("=== END ===");

    isnot(transcript.trim(), "", "Got a non-empty transcript");
    ok(transcript.length > 50, "Transcript has substantial content (>50 chars): " + transcript.length + " chars");

    SimpleTest.finish();
  } catch (e) {
    if (statusTimer) { clearInterval(statusTimer); }
    ok(false, "Test threw: " + e + "\n" + e.stack);
    SimpleTest.finish();
  }
});
</script>
</pre>
</body>
</html>
